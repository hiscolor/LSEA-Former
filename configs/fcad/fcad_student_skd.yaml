dataset_name: tad_tvil
train_split: ['train']
val_split: ['validation']
test_split: ['test']
model_name: FCADFormer
output_folder: outputs/fcad_student
dataset:
  json_file: data/TAD_TVIL/annotations/metadata.json
  feat_folder: data/TAD_TVIL/npy_features
  feb_feat_folder: data/TAD_TVIL/feb_features
  enable_feb: true
  file_prefix: null
  file_ext: .npy
  num_classes: 1
  input_dim: 1408
  feat_stride: 1
  num_frames: 16
  default_fps: ~
  max_seq_len: 768
  trunc_thresh: 0.5
  crop_ratio: [0.9, 1.0]
  force_upsampling: true
  downsample_rate: 1
  audio_feat_folder: null
  audio_file_ext: .npy
  audio_input_dim: 0
model:
  backbone_type: convTransformer
  fpn_type: fpn
  max_seq_len: 768
  max_buffer_len_factor: 1.0
  n_head: 4
  n_mha_win_size: [7, 7, 7, -1]
  embd_kernel_size: 3
  embd_dim: 128
  embd_with_ln: true
  fpn_dim: 128
  fpn_with_ln: true
  fpn_start_level: 0
  head_dim: 128
  head_kernel_size: 3
  head_num_layers: 2
  head_with_ln: true
  regression_range: [[0, 4], [4, 8], [8, 16], [16, 10000]]
  backbone_arch: [1, 1, 3]
  scale_factor: 2
  input_dim: 1408
  audio_input_dim: 0
  num_classes: 1
  use_abs_pe: true
  use_rel_pe: false
  mlp_ratio: 4.0
train_cfg:
  loss_weight: 2.0
  cls_prior_prob: 0.01
  init_loss_norm: 200
  center_sample: radius
  center_sample_radius: 1.5
  clip_grad_l2norm: 1.0
  head_empty_cls: []
  dropout: 0.1
  droppath: 0.1
  label_smoothing: 0.1
  fcad:
    enable_feb: true
    enable_cmam: true
    lambda_seg: 1.5
    lambda_vid: 1.5
    tau: 1.0
    topk_ratio: 0.15
    topk_min: 6
    feb:
      evidence_dim: 64
      input_evidence_dim: 14
      topk_patches: 32
      num_heads: 2
  distillation:
    enabled: true
    use_skd: true
    teacher_config: configs/fcad/fcad_feb_cmam_30ep.yaml
    teacher_ckpt: outputs/fcad_teacher/fcad_feb_cmam_30ep_v10_cleaned/model_best.pth.tar
    temperature: 4.0
    alpha: 0.5
    beta: 1.0
    theta_conf: 0.3
    topk_ratio: 0.15
    topk_min: 6
    kd_clip_weight: 1.0
    kd_vid_weight: 0.5
opt:
  type: AdamW
  momentum: 0.9
  weight_decay: 0.05
  learning_rate: 0.0008
  epochs: 15
  warmup: linear
  warmup_epochs: 3
  schedule_type: cosine
  schedule_steps: []
  schedule_gamma: 0.1
loader:
  batch_size: 4
  num_workers: 4
